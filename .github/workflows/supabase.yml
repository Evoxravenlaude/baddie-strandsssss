# Deploys the Supabase side of Baddie Strands on every push to main that
# touches supabase/ — Edge Functions, their secrets, and (when it changes)
# the database schema. Run it by hand from the Actions tab too.
#
# GitHub → repo → Settings → Secrets and variables → Actions → New repository secret:
#   SUPABASE_ACCESS_TOKEN   supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF    first part of your Supabase URL (abcd1234 in abcd1234.supabase.co)
#   SUPABASE_DB_URL         Project Settings → Database → Connection string → "Session pooler" URI (with password)
#   PAYSTACK_SECRET_KEY     sk_test_... (sk_live_... later)
#   BREVO_API_KEY           xkeysib-...
#   EMAIL_FROM              Baddie Strands <your-verified-sender>
#   BANK_ACCOUNT            the real Access Bank number (same as site/js/config.js)
# Optional (defaults shown): ADMIN_EMAIL, SHOP_URL, ADMIN_URL, BANK_NAME, BANK_ACCOUNT_NAME, WHATSAPP_NUMBER

name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:
    inputs:
      run_schema:
        description: 'Also run supabase/schema.sql (safe to re-run)'
        type: boolean
        default: false

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0   # pinned: v4 drops --project-ref and may change flags

      - name: Check required secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN PROJECT_REF PAYSTACK_SECRET_KEY BREVO_API_KEY EMAIL_FROM; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing"; exit 1; fi

      - name: Did the schema change?
        id: schema
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=${{ inputs.run_schema }}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qx 'supabase/schema.sql'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply database schema
        if: steps.schema.outputs.run == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::SUPABASE_DB_URL secret is missing"; exit 1; fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql

      - name: Set Edge Function secrets
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'baddiestrands@gmail.com' }}
          SHOP_URL: ${{ secrets.SHOP_URL || 'https://baddie-strands.vercel.app' }}
          ADMIN_URL: ${{ secrets.ADMIN_URL || 'https://baddie-strands-admin.vercel.app' }}
          BANK_NAME: ${{ secrets.BANK_NAME || 'Access Bank' }}
          BANK_ACCOUNT: ${{ secrets.BANK_ACCOUNT }}
          BANK_ACCOUNT_NAME: ${{ secrets.BANK_ACCOUNT_NAME || 'Baddie Strands' }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER || '2347033247980' }}
        run: |
          f=$(mktemp)
          for v in PAYSTACK_SECRET_KEY BREVO_API_KEY EMAIL_FROM ADMIN_EMAIL SHOP_URL ADMIN_URL BANK_NAME BANK_ACCOUNT BANK_ACCOUNT_NAME WHATSAPP_NUMBER; do
            val="${!v}"
            [ -n "$val" ] && printf '%s=%s\n' "$v" "$(printf '%s' "$val" | sed 's/"/\\"/g; s/.*/"&"/')" >> "$f"
          done
          echo "EMAIL_PROVIDER=brevo" >> "$f"
          supabase secrets set --remote="$PROJECT_REF" --env-file "$f" --yes
          rm -f "$f"

      - name: Deploy Edge Functions
        run: supabase functions deploy --remote="$PROJECT_REF" --use-api --yes
